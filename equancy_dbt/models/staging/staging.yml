version: 2

models:
  - name: stg_gdp_unesco
    description: "Nettoyage et standardisation de gdp_unesco"
    columns:
      - name: country_code
        tests:
          - not_null
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code

      - name: year
        tests:
          - not_null
      - name: gdp_value
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year
              
  - name: stg_population_thousands
    description: "Population totale par pays et par année, en milliers d'habitants."
    columns:
      - name: country_code
        tests:
          - not_null
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: year
        tests:
          - not_null
      - name: population_thousands
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year
  - name: stg_country_table
    description: "Référentiel des 168 pays (nom et code ISO alpha-3)."
    columns:
      - name: country_code
        tests:
          - not_null
          - unique
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: country_name
        tests:
          - not_null

  - name: stg_table_date
    description: "Calendrier annuel : un 1er janvier par année, de 1750 à 2045."
    columns:
      - name: year
        tests:
          - not_null
          - unique
      - name: date_day
        tests:
          - not_null

  - name: stg_demographic_indicators
    description: "Espérance de vie et part de la population rurale par pays et par année (format long, une ligne par indicateur)."
    columns:
      - name: country_code
        tests:
          - not_null
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: indicator_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['life_expectancy', 'rural_population_pct']
      - name: year
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2010
                max_value: 2021
      - name: indicator_value
        tests:
          - not_null:
              config:
                where: "indicator_code = 'life_expectancy'"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 120
              config:
                where: "indicator_code = 'life_expectancy'"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "indicator_code = 'rural_population_pct'"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - indicator_code
              - year

  - name: stg_emissions_per_country
    description: "Émissions de CO2 par entité et par année (total, par source, par habitant). Contient des agrégats (Global, International Transport) et des entités sans code ISO."
    columns:
      - name: country_code
        tests:
          # Contrôle 7 (les NULL des entités historiques sont ignorés, cf. H11)
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: country_name
        tests:
          - not_null
      - name: year
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1750
                max_value: 2021
      - name: total_mtco2
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: co2_per_capita
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_name
              - year

  - name: stg_government_expenses_in_education
    description: "Dépenses publiques d'éducation par pays et par année, en millions de dollars US constants. Panel incomplet : 1217 lignes pour 168 pays."
    columns:
      - name: country_code
        tests:
          - not_null
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: year
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2010
                max_value: 2022
      - name: education_expenditure_musd
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year

  - name: stg_expenditure_in_preservation_conservation
    description: "Dépenses de préservation du patrimoine par habitant (PPP$ constants 2017). ATTENTION : plusieurs valeurs par pays et par année, probablement une colonne de ventilation perdue à l'export. Non utilisé dans les analyses."
    columns:
      - name: country_code
        tests:
          - not_null
          # Contrôle 7 : le code existe dans la dimension pays
          - relationships:
              arguments:
                to: ref('dim_country')
                field: country_code
      - name: year
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2017
                max_value: 2022
      - name: heritage_expenditure_ppp_per_capita
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year
          config:
            severity: warn