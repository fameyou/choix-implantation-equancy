version: 2

models:
  - name: stg_gdp_unesco
    description: "Nettoyage et standardisation de gdp_unesco"
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: gdp_value
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year