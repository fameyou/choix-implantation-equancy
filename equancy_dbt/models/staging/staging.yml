version: 2

models:
  - name: stg_gdp_unesco
    description: "Nettoyage et standardisation de gdp_unesco"
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: gdp_value
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year

models:
  - name: stg_gdp_unesco
    description: "PIB par pays et par année (source UNESCO), converti en nombre."
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: gdp_value
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year

  - name: stg_population_thousands
    description: "Population totale par pays et par année, en milliers d'habitants."
    columns:
      - name: country_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: population_thousands
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - year
  - name: stg_country_table
    description: "Référentiel des 168 pays (nom et code ISO alpha-3)."
    columns:
      - name: country_code
        tests:
          - not_null
          - unique
      - name: country_name
        tests:
          - not_null

  - name: stg_table_date
    description: "Calendrier annuel : un 1er janvier par année, de 1750 à 2045."
    columns:
      - name: year
        tests:
          - not_null
          - unique
      - name: date_day
        tests:
          - not_null